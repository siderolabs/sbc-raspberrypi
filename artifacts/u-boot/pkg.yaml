# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
#   Broadcom/RaspberryPi
#     - https://github.com/u-boot/u-boot/blob/master/doc/board/broadcom/raspberrypi.rst
name: u-boot
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/refs/tags/v{{ .uboot_version }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        tar xf u-boot.tar.gz --strip-components=1
      # rpi_generic (built with rpi_arm64_defconfig, which "uses the device-tree provided by the firmware")
      - |
        patch -p1 < /pkg/patches/0002-rpi-add-NVMe-to-boot-order.patch
        patch -p1 < /pkg/patches/0004-usb-xhci-brcm-Make-driver-compatible-with-downstream.patch
        patch -p1 < /pkg/patches/0008-enable-nvme-and-fixup-efi-boot.patch

        make rpi_arm64_defconfig
        # Host tools: image signing needs the OpenSSL ENGINE API (removed in the toolchain's OpenSSL),
        # and mkeficapsule needs gnutls with PKCS#11 support; neither is used to build u-boot.bin.
        ./scripts/config --disable TOOLS_LIBCRYPTO --disable TOOLS_KWBIMAGE --disable TOOLS_MKEFICAPSULE
        make olddefconfig
    build:
      # rpi_generic
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto"
    install:
      # rpi_generic
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/rpi_generic
        cp -v u-boot.bin /rootfs/artifacts/arm64/u-boot/rpi_generic
finalize:
  - from: /rootfs
    to: /rootfs
